name: Bug report
description: Report a reproducible problem with the wallpaper
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please write the report in English when possible.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Plasma, Qt, session type, GPU and distribution.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostics
      description: Paste relevant output from scripts/diagnose.sh. Redact secrets.
