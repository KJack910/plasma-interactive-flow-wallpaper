name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu-plasma-toolchain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtdeclarative qttools'
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: QML lint
        run: qmllint package/contents/ui/main.qml package/contents/ui/config.qml
      - name: Version consistency
        run: ./scripts/check-version.sh
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh scripts/*.sh
