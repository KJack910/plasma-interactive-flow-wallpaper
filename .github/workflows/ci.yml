name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu-plasma-toolchain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake ninja-build g++ gettext \
            qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-tools-dev qt6-tools-dev-tools
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Translation catalog
        run: package/translate/build.sh
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: QML lint
        run: |
          set -o pipefail
          log=$(mktemp)
          if /usr/lib/qt6/bin/qmllint package/contents/ui/main.qml package/contents/ui/config.qml >"$log" 2>&1; then
            rc=0
          else
            rc=$?
          fi
          cat "$log"
          if [ "$rc" -ne 0 ] && grep -Eq '(^|[[:space:]])(Error:|Syntax error|fatal)' "$log"; then
            exit "$rc"
          fi
      - name: Version consistency
        run: ./scripts/check-version.sh
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh scripts/*.sh package/translate/*.sh
